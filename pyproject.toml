[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpassport"
version = "1.0.0"
description = "智能体数字护照与循环审计治理平台（零依赖内核）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "huzjie" }]
keywords = ["ai-agent", "governance", "audit", "provenance", "passport", "compliance"]

[project.scripts]
agentpassport = "agentpassport.cli.main:main"

[tool.setuptools.packages.find]
include = ["agentpassport*"]
