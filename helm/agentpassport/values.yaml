replicaCount: 2

image:
  repository: agentpassport
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

config:
  secret: "change-me-in-production"
  auditIntervalSec: 3600

resources:
  limits: { cpu: "500m", memory: "512Mi" }
  requests: { cpu: "100m", memory: "128Mi" }
